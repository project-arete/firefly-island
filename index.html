<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a1c" />
  <title>Firefly Island</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="firefly.css?v=31" />
</head>
<body>
  <main>
    <section id="gate">
      <img src="icon-192.png" alt="" class="logo" />
      <h1>Firefly Island</h1>
      <p class="tag">Your lamp only lights when someone else lights it.</p>
      <label>Your firefly's name
        <input id="name" maxlength="24" placeholder="e.g. Anto" autocomplete="nickname" />
      </label>
      <label>Your glow
        <div id="colors" class="swatches"></div>
      </label>
      <details>
        <summary>Island location</summary>
        <label>Realm host
          <input id="host" maxlength="64" spellcheck="false" />
        </label>
        <label>Island
          <select id="islepick"></select>
        </label>
        <label id="isleNameRow" hidden>Name your new island
          <input id="isleName" maxlength="24" placeholder="e.g. Moonlit Cove" />
        </label>
      </details>
      <button id="join">Fly to the island</button>
      <div class="gstamp"><span class="ffv"></span> · a CNS/CP toy — every lamp is a governed connection</div>
    </section>

    <section id="play" hidden>
      <canvas id="island"></canvas>

      <div id="status" class="glass">…</div>

      <div id="murmurs"></div>

      <div id="where" class="glass"></div>

      <div id="corner">
        <div id="fan" hidden>
          <button id="install" class="glass" hidden>Install</button>
          <button id="share" class="glass">Share</button>
          <button id="leave" class="glass">Leave</button>
        </div>
        <button id="fab" class="glass">✦</button>
        <div id="stamp"><span class="ffv"></span></div>
      </div>

      <div id="iosTip" hidden class="glass">On iPhone: tap the Share button <span class="shr">&#x2BAD;</span> in Safari, then “Add to Home Screen”.</div>

      <div id="qrmodal" hidden>
        <div class="qrcard glass">
          <h2>Bring a firefly</h2>
          <img id="qrimg" alt="QR code for this island" />
          <div id="qrurl"></div>
          <div class="row">
            <button id="qrcopy">Copy link</button>
            <button id="qrclose" class="ghost">Close</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="qrcode.js?v=31"></script>
  <script src="game.js?v=31"></script>
</body>
</html>
